# Lint and test on every push and pull request. The test suite needs no API key or
# network access (it uses a fake LLM and a hashing embedder), so it runs anywhere.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src app scripts eval tests
          ruff format --check src app scripts eval tests

      - name: Test
        run: pytest
