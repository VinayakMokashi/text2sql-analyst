[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text2sql-analyst"
version = "0.1.0"
description = "Ask questions about a SQL database in plain English and get answers, analysis and charts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Vinayak Mokashi" }]
dependencies = [
    "openai>=1.40",
    "sqlglot>=25",
    "chromadb>=0.5",
    "fastembed>=0.4",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "streamlit>=1.51",
    "altair>=5",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
text2sql = "text2sql.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The app puts src/ on sys.path before importing the package (for Streamlit Cloud).
"app/streamlit_app.py" = ["E402"]
