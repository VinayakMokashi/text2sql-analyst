# Secrets for Streamlit Community Cloud. Paste these into the app's
# Settings -> Secrets box; never put real values in this file or commit a
# secrets.toml. Top-level values reach the app as environment variables.

GROQ_API_KEY = "gsk_your_key_here"

# Every visitor spends your free-tier tokens, so cap the demo:
T2S_DEMO_DAILY_LIMIT = "40"    # questions per day, shared by all visitors
T2S_DEMO_SESSION_LIMIT = "10"  # questions per visit
